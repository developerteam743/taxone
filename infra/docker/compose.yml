services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taxone
      POSTGRES_PASSWORD: taxone
      POSTGRES_DB: taxone
    ports: ["5432:5432"]
    volumes: [taxone_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxone -d taxone"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  taxone_pg:
