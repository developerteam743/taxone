services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: taxone, POSTGRES_USER: taxone, POSTGRES_PASSWORD: change-me-in-local-env}
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment: {DATABASE_URL: postgresql://taxone:change-me-in-local-env@postgres:5432/taxone, REDIS_URL: redis://redis:6379, JWT_SECRET: change-me-development-secret, APP_URL: http://localhost:3000}
    depends_on: [postgres, redis]
    ports: ['4000:4000']
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    environment: {NEXT_PUBLIC_API_URL: http://localhost:4000}
    depends_on: [api]
    ports: ['3000:3000']
  worker:
    build: {context: ., dockerfile: apps/worker/Dockerfile}
    environment: {REDIS_URL: redis://redis:6379}
    depends_on: [redis]
  ocr:
    build: {context: ./services/ocr}
    ports: ['8000:8000']
volumes: {postgres_data: {}, redis_data: {}}
