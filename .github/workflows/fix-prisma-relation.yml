name: Fix Prisma relation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing Organization.documents relation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/database/prisma/schema.prisma')
          text = path.read_text()
          start = text.index('model Organization {')
          end = text.index('\n}\n\nmodel User {', start) + 2
          block = text[start:end]
          if 'documents Document[]' not in block:
              if '  settings Setting[]' not in block:
                  raise SystemExit('Organization settings relation not found')
              block = block.replace('  settings Setting[]\n', '  settings Setting[]\n  documents Document[]\n', 1)
              text = text[:start] + block + text[end:]
              path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/prisma/schema.prisma
          git diff --cached --quiet && exit 0
          git commit -m 'fix(db): add organization documents relation'
          git push
