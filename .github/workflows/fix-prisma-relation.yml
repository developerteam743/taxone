name: Fix Prisma relation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing Organization.documents relation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/database/prisma/schema.prisma')
          text = path.read_text()
          needle = '  settings Setting[]\n'
          replacement = needle + '  documents Document[]\n'
          if '  documents Document[]\n' not in text:
              if needle not in text:
                  raise SystemExit('Organization settings relation not found')
              text = text.replace(needle, replacement, 1)
              path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/prisma/schema.prisma
          git diff --cached --quiet && exit 0
          git commit -m 'fix(db): add organization documents relation'
          git push
