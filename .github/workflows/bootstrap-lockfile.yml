name: Bootstrap lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: tar -czf generated-lockfile.tgz pnpm-lock.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: generated-lockfile
          path: generated-lockfile.tgz
