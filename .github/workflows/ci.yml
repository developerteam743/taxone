name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taxone
          POSTGRES_PASSWORD: taxone
          POSTGRES_DB: taxone
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://taxone:taxone@localhost:5432/taxone
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Playwright browser
        run: pnpm --filter @taxone/web exec playwright install --with-deps chromium
      - name: Generate Prisma client
        run: pnpm --filter @taxone/database generate
      - name: Validate Prisma schema
        run: pnpm --filter @taxone/database exec prisma validate
      - name: Apply database migrations
        run: pnpm --filter @taxone/database exec prisma migrate deploy
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
