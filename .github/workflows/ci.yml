name: CI
on: [push,pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: taxone, POSTGRES_PASSWORD: taxone, POSTGRES_DB: taxone}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taxone -d taxone"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9.15.0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @taxone/database prisma:generate
      - run: pnpm --filter @taxone/accounting test
      - run: pnpm --filter @taxone/accounting typecheck
      - run: pnpm --filter @taxone/gst typecheck
      - run: pnpm --filter @taxone/gst build
      - run: pnpm --filter @taxone/api build
      - run: pnpm --filter @taxone/web build
