name: One-time reports implementation
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch report support
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          def write_json(path, value): Path(path).write_text(json.dumps(value, indent=2) + "\n")
          for path in ["packages/gst/package.json", "packages/accounting/package.json"]:
              p=Path(path); data=json.loads(p.read_text()); data.update({"main":"dist/index.js","types":"dist/index.d.ts","files":["dist"]}); write_json(p,data)
          p=Path("apps/api/src/main.ts"); s=p.read_text(); marker="import { calculateTax } from '@taxone/gst';"
          if "from '@taxone/accounting'" not in s: s=s.replace(marker, marker+"\nimport { profitAndLoss, balanceSheet, ledger } from '@taxone/accounting';")
          methods="""\n@Get('businesses/:id/reports/profit-and-loss') async profitLoss(@Headers('authorization') h: string, @Param('id') id: string, @Headers('x-from-date') fromHeader?: string, @Headers('x-to-date') toHeader?: string) { const p=claims(h); const biz=await db.business.findFirst({where:{id,organizationId:p.organizationId}}); if(!biz) throw new ForbiddenException(); const from=fromHeader?new Date(fromHeader):new Date(new Date().getFullYear(),3,1); const to=toHeader?new Date(toHeader):new Date(); if(Number.isNaN(from.getTime())||Number.isNaN(to.getTime())||from>to) throw new BadRequestException('Invalid report date range'); const accounts=await db.account.findMany({where:{businessId:id},include:{lines:{where:{journalEntry:{date:{gte:from,lte:to},status:'POSTED'}}}}}); const rows=accounts.map(a=>{const debit=a.lines.reduce((s,l)=>s.plus(l.debit),new Decimal(0));const credit=a.lines.reduce((s,l)=>s.plus(l.credit),new Decimal(0));return {accountId:a.id,name:a.name,type:a.type,debit,credit};}); const result=profitAndLoss(rows as any); return {from,to,income:result.income.toFixed(2),expense:result.expense.toFixed(2),netProfit:result.netProfit.toFixed(2),accounts:rows.map(x=>({...x,debit:x.debit.toFixed(2),credit:x.credit.toFixed(2)}))}; }\n@Get('businesses/:id/reports/balance-sheet') async balance(@Headers('authorization') h: string, @Param('id') id: string, @Headers('x-as-of-date') asOfHeader?: string) { const p=claims(h); const biz=await db.business.findFirst({where:{id,organizationId:p.organizationId}}); if(!biz) throw new ForbiddenException(); const asOf=asOfHeader?new Date(asOfHeader):new Date(); if(Number.isNaN(asOf.getTime())) throw new BadRequestException('Invalid as-of date'); const accounts=await db.account.findMany({where:{businessId:id},include:{lines:{where:{journalEntry:{date:{lte:asOf},status:'POSTED'}}}}}); const rows=accounts.map(a=>{const debit=a.lines.reduce((s,l)=>s.plus(l.debit),new Decimal(0));const credit=a.lines.reduce((s,l)=>s.plus(l.credit),new Decimal(0));return {accountId:a.id,name:a.name,type:a.type,debit,credit};}); const result=balanceSheet(rows as any); return {asOf,assets:result.assets.toFixed(2),liabilities:result.liabilities.toFixed(2),equity:result.equity.toFixed(2),difference:result.difference.toFixed(2),accounts:rows.map(x=>({...x,debit:x.debit.toFixed(2),credit:x.credit.toFixed(2)}))}; }\n@Get('businesses/:id/reports/ledger') async accountLedger(@Headers('authorization') h: string, @Param('id') id: string, @Headers('x-account-id') accountId?: string) { const p=claims(h); const biz=await db.business.findFirst({where:{id,organizationId:p.organizationId}}); if(!biz) throw new ForbiddenException(); const accounts=await db.account.findMany({where:{businessId:id}}); const lines=await db.journalLine.findMany({where:{account:{businessId:id},journalEntry:{status:'POSTED'}},include:{journalEntry:true}}); const result=ledger(accounts.map(a=>({accountId:a.id,name:a.name,type:a.type as any,debit:0,credit:0})),lines.map(l=>({accountId:l.accountId,date:l.journalEntry.date,entryNumber:l.journalEntry.entryNumber,debit:l.debit,credit:l.credit}))); const filtered=accountId?result.filter(x=>x.accountId===accountId):result; return filtered.map(x=>({...x,entries:x.entries.map(e=>({...e,debit:e.debit.toString(),credit:e.credit.toString(),balance:e.balance.toString()}))})); }\n"""
          if "reports/profit-and-loss" not in s: s=s.replace("\n}\n@Module({ controllers: [AuthController, AppController]", methods+"\n}\n@Module({ controllers: [AuthController, AppController]")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/gst/package.json packages/accounting/package.json apps/api/src/main.ts
          git diff --cached --quiet || git commit -m "feat(api): add accounting report endpoints"
          git push
