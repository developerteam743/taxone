name: One-time API build fixer
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.event.head_commit.message != 'chore(ci): remove one-time API build fixer'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch API build errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/main.ts')
          s = p.read_text()
          s = s.replace("[InvoiceStatus.POSTED, InvoiceStatus.PAID, InvoiceStatus.PARTIALLY_PAID].includes(invoice.status)", "([InvoiceStatus.POSTED, InvoiceStatus.PAID, InvoiceStatus.PARTIALLY_PAID] as InvoiceStatus[]).includes(invoice.status)")
          s = s.replace("after: { journalEntryId: je.id, gstRecordId: gst.id }", "metadata: { journalEntryId: je.id, gstRecordId: gst.id }")
          s = s.replace("after: { amount: amount.toFixed(2), type: b.type }", "metadata: { amount: amount.toFixed(2), type: b.type }")
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/main.ts
          git diff --cached --quiet || git commit -m 'fix(api): resolve TypeScript build errors'
          git push
      - name: Remove fixer
        run: |
          rm .github/workflows/fix-api-build.yml
          git add .github/workflows/fix-api-build.yml
          git commit -m 'chore(ci): remove one-time API build fixer'
          git push
